name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/brain-v1
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (Google cmdline-tools)
        run: |
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install platform & build-tools
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null || true
          sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Rename APK to Jarvis.apk
        run: |
          if [ -f app/build/outputs/apk/debug/Jarvis-debug.apk ]; then
            mv app/build/outputs/apk/debug/Jarvis-debug.apk app/build/outputs/apk/debug/Jarvis.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jarvis.apk
          else
            echo "APK not found!" && ls -la app/build/outputs/apk/debug/ && exit 1
          fi
          ls -lh app/build/outputs/apk/debug/Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: app/build/outputs/apk/debug/Jarvis.apk
          retention-days: 30

      - name: Publish public download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "J.A.R.V.I.S. — Latest Build"
          body: |
            **J.A.R.V.I.S.** — Tony Stark style offline-first voice assistant.
            Download `Jarvis.apk` below and install it.
            Say **"Jarvis"** to activate.
          files: app/build/outputs/apk/debug/Jarvis.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
