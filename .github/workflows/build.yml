name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/brain-v1
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publishes a public, no-login-required download at a stable URL:
      # github.com/<user>/JarvisAI/releases/latest — this is what you'd
      # actually share in groups/channels, not the Actions artifact above.
      - name: Publish public download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Jarvis AI — Latest Build"
          body: |
            Automatically built from the latest `main` branch.
            Download `app-debug.apk` below and install it (you'll need to allow
            "install from unknown sources" the first time).
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
