name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK to Jarvis.apk
        run: |
          mkdir -p app/build/outputs/apk/debug/renamed
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in app/build/outputs/apk/debug"
            ls -la app/build/outputs/apk/debug || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" app/build/outputs/apk/debug/renamed/Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: app/build/outputs/apk/debug/renamed/Jarvis.apk
          if-no-files-found: error

      - name: Publish public download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Jarvis AI — Latest Build"
          body: |
            Automatically built from the latest `main` branch.
            Download `Jarvis.apk` below and install it (you'll need to allow
            "install from unknown sources" the first time).
          files: app/build/outputs/apk/debug/renamed/Jarvis.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
